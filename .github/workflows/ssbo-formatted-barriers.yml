name: Formatted SSBO barrier source preconditions

on:
  pull_request:
    paths:
      - 'gpu/shadps4/shader_recompiler/ir/passes/insert_ssbo_store_load_barrier.cpp'
      - 'gpu/shadps4/shader_recompiler/recompiler.cpp'
      - 'gpu/shadps4/shader_recompiler/ssbo_barrier_cache_version.h'
      - 'gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_serialization.cpp'
      - 'gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_serialization.h'
      - 'gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_cache.cpp'
      - 'tests/test_ssbo_barrier_cache.cpp'
      - 'gpu/CMakeLists.txt'
      - 'tools/run_tests.sh'
      - 'tests/test_formatted_ssbo_barriers.cpp'
      - 'tests/test_ssbo_barrier_structure.py'
      - '.github/workflows/ssbo-formatted-barriers.yml'
  push:
    branches: [master]
    paths:
      - 'gpu/shadps4/shader_recompiler/ir/passes/insert_ssbo_store_load_barrier.cpp'
      - 'gpu/shadps4/shader_recompiler/recompiler.cpp'
      - 'gpu/shadps4/shader_recompiler/ssbo_barrier_cache_version.h'
      - 'gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_serialization.cpp'
      - 'gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_serialization.h'
      - 'gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_cache.cpp'
      - 'tests/test_ssbo_barrier_cache.cpp'
      - 'gpu/CMakeLists.txt'
      - 'tools/run_tests.sh'
      - 'tests/test_formatted_ssbo_barriers.cpp'
      - 'tests/test_ssbo_barrier_structure.py'
      - '.github/workflows/ssbo-formatted-barriers.yml'

permissions:
  contents: read

jobs:
  source-preconditions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run selective shader cache salt tests
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Igpu/shadps4 \
            tests/test_ssbo_barrier_cache.cpp -o /tmp/ssbo-barrier-cache-test
          /tmp/ssbo-barrier-cache-test
      - name: Check formatted opcode inclusion and pass ordering
        run: |
          python -m unittest discover -s tests -p test_ssbo_barrier_structure.py -v
