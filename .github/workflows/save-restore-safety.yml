name: Savedata restore safety

on:
  pull_request:
    paths:
      - 'scripts/save_backup.py'
      - 'tests/test_save_backup.py'
      - 'docs/SAVEDATA_RESTORE_SAFETY.md'
      - '.github/workflows/save-restore-safety.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/save_backup.py'
      - 'tests/test_save_backup.py'
      - 'docs/SAVEDATA_RESTORE_SAFETY.md'
      - '.github/workflows/save-restore-safety.yml'

permissions:
  contents: read

jobs:
  restore:
    name: Test rollback and recovery without user saves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run backup and restore failure tests
        env:
          PYTHONPATH: tests
        run: python -m unittest -v test_save_backup
