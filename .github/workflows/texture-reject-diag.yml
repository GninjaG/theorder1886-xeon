name: Texture rejection diagnostic tests

on:
  pull_request:
    paths:
      - 'gpu/shim/port_texture_reject_diag.h'
      - 'gpu/shadps4/video_core/renderer_vulkan/vk_rasterizer.cpp'
      - 'tests/test_texture_reject_diag.cpp'
      - 'tools/run_tests.sh'
      - '.github/workflows/texture-reject-diag.yml'
  push:
    branches: [master]
    paths:
      - 'gpu/shim/port_texture_reject_diag.h'
      - 'gpu/shadps4/video_core/renderer_vulkan/vk_rasterizer.cpp'
      - 'tests/test_texture_reject_diag.cpp'
      - 'tools/run_tests.sh'
      - '.github/workflows/texture-reject-diag.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run diagnostics unit tests
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -Igpu/shim \
            tests/test_texture_reject_diag.cpp -o /tmp/texture-reject-diag-test
          /tmp/texture-reject-diag-test
