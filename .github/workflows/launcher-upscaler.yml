name: Launcher upscaler regression

on:
  pull_request:
    paths:
      - 'launcher/port_launcher_win.py'
      - 'tests/test_launcher_controls.py'
      - 'tests/test_launcher_migration_safety.py'
      - '.github/workflows/launcher-upscaler.yml'
  push:
    branches: [master]
    paths:
      - 'launcher/port_launcher_win.py'
      - 'tests/test_launcher_controls.py'
      - 'tests/test_launcher_migration_safety.py'
      - '.github/workflows/launcher-upscaler.yml'

permissions:
  contents: read

jobs:
  upscaler-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Launcher import and upscaler propagation regression
        env:
          PYTHONPATH: tests
        run: |
          python -m unittest -v \
            test_launcher_controls.ControlMapTest.test_upscaler_selection_comes_from_ini_not_launch_environment \
            test_launcher_controls.ControlMapTest.test_launcher_ignores_stale_upscaler_in_json_too
      - name: Preserve legacy settings during portable migration
        env:
          PYTHONPATH: tests
        run: |
          python -m unittest -v test_launcher_migration_safety
