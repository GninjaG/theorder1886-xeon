name: MSYS2 toolchain path selection

on:
  pull_request:
    paths:
      - 'msys2-env.sh'
      - 'tests/test_msys2_env.py'
      - '.github/workflows/msys2-paths.yml'
  push:
    branches: [master]
    paths:
      - 'msys2-env.sh'
      - 'tests/test_msys2_env.py'
      - '.github/workflows/msys2-paths.yml'

permissions:
  contents: read

jobs:
  shell:
    name: Check MSYS2 root and shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Bash syntax
        run: bash -n msys2-env.sh
      - name: Verify explicit root and fallback order
        env:
          PYTHONPATH: tests
        run: python -m unittest -v test_msys2_env
