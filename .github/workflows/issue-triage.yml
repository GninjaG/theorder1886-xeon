name: Issue triage

on:
  issues:
    types: [opened, edited]
  pull_request:
    paths:
      - '.github/scripts/issue-triage.js'
      - '.github/scripts/issue-triage.test.js'
      - '.github/workflows/issue-triage.yml'
  push:
    branches: [master]
    paths:
      - '.github/scripts/issue-triage.js'
      - '.github/scripts/issue-triage.test.js'
      - '.github/workflows/issue-triage.yml'

permissions:
  contents: read

jobs:
  test-triage:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/issue-triage.test.js

  label-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {plannedLabels, LABEL_COLORS} = require('./.github/scripts/issue-triage.js');
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;
            const {add, remove} = plannedLabels(issue.body, issue.labels ?? []);
            for (const name of add) {
              try {
                await github.rest.issues.getLabel({...context.repo, name});
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name, color: LABEL_COLORS[name],
                    description: 'Automated issue classification',
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }
            if (add.length) await github.rest.issues.addLabels({
              ...context.repo, issue_number: issue.number, labels: add,
            });
            for (const name of remove) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: issue.number, name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.info('Issue #' + issue.number + ': add [' + add + '], remove [' + remove + ']');
